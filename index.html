<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medlearnix</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0f14;
    color: #e8edf2;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 480px; }
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  p {
    font-size: 1.05rem;
    color: #9aa7b4;
    margin: 0 0 28px;
    line-height: 1.5;
  }
  .badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(88, 166, 255, 0.15);
    color: #58a6ff;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Work in progress</span>
    <h1>Medlearnix is coming soon</h1>
    <p>We're building something great. The site is currently under construction — check back soon.</p>
  </div>
</body>
</html>
